<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">SocialSync</title>
  <desc id="desc">AI captions, scheduling and analytics for Instagram, Facebook, X and LinkedIn.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="900" height="220" rx="24"/>
    </clipPath>
    <marker id="head" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Background -->
  <g clip-path="url(#card)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <circle cx="840" cy="20" r="130" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="700" cy="240" r="90" fill="#FFFFFF" fill-opacity="0.05"/>

    <!-- Mini analytics chart -->
    <g fill="#FFFFFF" fill-opacity="0.22">
      <rect x="680" y="135" width="22" height="45" rx="5"/>
      <rect x="714" y="110" width="22" height="70" rx="5"/>
      <rect x="748" y="122" width="22" height="58" rx="5"/>
      <rect x="782" y="85" width="22" height="95" rx="5"/>
      <rect x="816" y="98" width="22" height="82" rx="5"/>
    </g>
    <polyline points="691,125 725,100 759,112 793,75 827,88" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Logo mark: sync arrows -->
  <g transform="translate(110 110)">
    <circle r="62" fill="#FFFFFF" fill-opacity="0.16"/>
    <circle r="46" fill="#FFFFFF"/>
    <g fill="none" stroke="#7C3AED" stroke-width="6" stroke-linecap="round">
      <path d="M -25.1 -6.7 A 26 26 0 0 1 18.4 -18.4" marker-end="url(#head)"/>
      <path d="M 25.1 6.7 A 26 26 0 0 1 -18.4 18.4" marker-end="url(#head)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="200" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#FFFFFF">SocialSync</text>
  <text x="202" y="136" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" fill-opacity="0.9">AI captions · Scheduling · Analytics</text>

  <!-- Platform pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">
    <rect x="200" y="160" width="108" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.18"/>
    <circle cx="216" cy="175" r="5" fill="#E1306C" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="228" y="180">Instagram</text>

    <rect x="318" y="160" width="100" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.18"/>
    <circle cx="334" cy="175" r="5" fill="#1877F2" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="346" y="180">Facebook</text>

    <rect x="428" y="160" width="48" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.18"/>
    <circle cx="444" cy="175" r="5" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="456" y="180">X</text>

    <rect x="486" y="160" width="98" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.18"/>
    <circle cx="502" cy="175" r="5" fill="#0A66C2" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="514" y="180">LinkedIn</text>
  </g>
</svg>
