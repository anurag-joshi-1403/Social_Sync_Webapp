<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">SocialSync logo</title>
  <!-- The sync-arrows mark from banner.svg, on the banner's gradient. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#bg)"/>
  <g transform="translate(64 64)">
    <circle r="46" fill="#FFFFFF"/>
    <g fill="none" stroke="#7C3AED" stroke-width="6" stroke-linecap="round">
      <path d="M -25.1 -6.7 A 26 26 0 0 1 18.4 -18.4" marker-end="url(#head)"/>
      <path d="M 25.1 6.7 A 26 26 0 0 1 -18.4 18.4" marker-end="url(#head)"/>
    </g>
  </g>
</svg>
